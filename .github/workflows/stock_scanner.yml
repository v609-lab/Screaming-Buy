name: Daily US Stock Screaming Buy Agent

on:
  schedule:
    - cron: '0 21 * * 1-5'
  workflow_dispatch:

jobs:
  run-stock-agent:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show all files in workspace (Debug)
        run: |
          echo "Current directory contents:"
          find . -maxdepth 3 -not -path '*/.*'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies and run agent
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
        run: |
          # Automatically navigates into the subfolder if it exists, or stays in root
          if [ -d "Screaming-Buy" ]; then
            cd Screaming-Buy
          fi
          
          echo "Working directory is now: $(pwd)"
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python stock_agent.py
