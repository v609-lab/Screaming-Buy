name: Daily US Stock Screaming Buy Agent

on:
  schedule:
    # Runs Monday through Friday at 21:00 UTC (Approx 5:00 PM EST after market close)
    - cron: '0 21 * * 1-5'
  workflow_dispatch: # Lets you run it manually anytime with one click

jobs:
  run-stock-agent:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Screaming-Buy/Screaming-Buy/requirements.txt

      - name: Run Stock Agent Scanner
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
        run: |
          python stock_agent.py
